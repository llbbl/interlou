baseURL = "https://example.test/"
title = "Interlou Fixture"
locale = "en-US"

[pagination]
  pagerSize = 2

[params]
  description = "Representative Micro.blog content for Interlou compatibility tests."
  footer = "Fixture footer"
  include_conversation = true

  [params.author]
    name = "Fixture Author"
    username = "fixture"
    avatar = "https://example.test/avatar.png"

[permalinks]
  posts = "/:year/:month/:day/:slug/"

[taxonomies]
  category = "categories"

[outputs]
  home = ["HTML", "RSS"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[[menus.main]]
  name = "About"
  url = "/about/"
  weight = 1

[[menus.main]]
  name = "Archive"
  url = "/archive/"
  weight = 2

[[menus.main]]
  name = "Replies"
  url = "/replies/"
  weight = 3

[[menus.main]]
  name = "Links"
  url = "/links/"
  weight = 4
